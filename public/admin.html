<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel | Spider Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <b class="logo">SPIDER CLASH <span class="tag">Admin</span></b>
  <nav class="pill" aria-label="Admin sections">
    <button data-tab="games" class="on" type="button">Games &amp; prizes</button>
    <button data-tab="matches" type="button">Matches</button>
    <button data-tab="standings" type="button">Standings</button>
    <button data-tab="teams" type="button">Teams</button>
  </nav>
  <div class="user"><button class="btn ghost sm" id="logout" type="button">Log out</button></div>
</header>
<main class="wrap" id="app"><p class="muted">Loading...</p></main>
<div id="toast" class="toast" hidden></div>
<script src="js/images.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
